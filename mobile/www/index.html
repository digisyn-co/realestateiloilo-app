<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Iloilo Real Estate</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: radial-gradient(120% 90% at 50% 34%, #0A2A1F 0%, #031A14 55%, #050706 100%);
        color: #F4F0E6;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
      .logo { width: min(72vw, 340px); height: auto; }
      .sub { margin-top: 6px; font-size: 13px; letter-spacing: .02em; color: rgba(244,240,230,.6); }
      .ring { margin-top: 30px; width: 30px; height: 30px; border-radius: 999px; border: 3px solid rgba(214,168,79,.25); border-top-color: #D6A84F; animation: spin 0.9s linear infinite; }
      .offline { display: none; margin-top: 22px; }
      .offline.show { display: block; }
      .retry { margin-top: 14px; padding: 12px 22px; border: none; border-radius: 14px; background: #D6A84F; color: #031A14; font-weight: 700; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="./logo.png" alt="The Iloilo Real Estate" />
      <div class="sub" id="msg">Real Estate Made Easy in Iloilo</div>
      <div class="ring" id="ring"></div>
      <div class="offline" id="offline">
        <div class="sub">You're offline. Reconnect to browse the latest listings.</div>
        <button class="retry" onclick="location.reload()">Try again</button>
      </div>
    </div>
    <script>
      // Splash/offline placeholder for the native app. Inside the Capacitor shell
      // (online) the WebView loads the live app directly. When shown:
      //   • offline → reconnect UI · • plain browser → redirect to the live app
      (function () {
        var LIVE = "https://realestateiloilo-app.vercel.app/browse";
        var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        setTimeout(function () {
          if (!navigator.onLine) {
            document.getElementById("ring").style.display = "none";
            document.getElementById("msg").style.display = "none";
            document.getElementById("offline").classList.add("show");
            return;
          }
          if (!isNative) location.replace(LIVE);
        }, 1500);
      })();
    </script>
  </body>
</html>
