<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Real Estate Iloilo</title>
    <style>
      @font-face { font-family: "Instrument Serif"; src: local("Instrument Serif"); }
      :root { color-scheme: light; }
      html, body {
        margin: 0; height: 100%;
        background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f3ede4 64%);
        color: #1a1714;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      .brand { font-family: "Instrument Serif", Georgia, serif; font-size: 34px; letter-spacing: -0.02em; }
      .brand em { color: #b4551a; font-style: italic; }
      .sub { margin-top: 10px; font-size: 14px; color: #6b6259; max-width: 260px; line-height: 1.5; }
      .ring { margin-top: 28px; width: 34px; height: 34px; border-radius: 999px; border: 3px solid #e4dcd1; border-top-color: #b4551a; animation: spin 0.9s linear infinite; }
      .offline { display: none; margin-top: 22px; }
      .offline.show { display: block; }
      .retry { margin-top: 14px; padding: 12px 22px; border: none; border-radius: 14px; background: #b4551a; color: #fff; font-weight: 600; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Real Estate <em>Iloilo</em></div>
      <div class="sub" id="msg">Finding your place in Iloilo…</div>
      <div class="ring" id="ring"></div>
      <div class="offline" id="offline">
        <div class="sub">You're offline. Reconnect to browse the latest listings.</div>
        <button class="retry" onclick="location.reload()">Try again</button>
      </div>
    </div>
    <script>
      // If Capacitor loads this fallback (no network to the live app), show offline UI.
      setTimeout(function () {
        if (!navigator.onLine) {
          document.getElementById("ring").style.display = "none";
          document.getElementById("msg").style.display = "none";
          document.getElementById("offline").classList.add("show");
        }
      }, 2500);
    </script>
  </body>
</html>
